<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbbf0"/>
      <stop offset="0.45" stop-color="#b9e0f7"/>
      <stop offset="0.75" stop-color="#f6dccb"/>
      <stop offset="1" stop-color="#f1c9b6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.74" cy="0.25" r="0.32">
      <stop offset="0" stop-color="#fffbea" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffbea" stop-opacity="0"/>
    </radialGradient>
    <!-- A touch of watercolor on the hill edges, kept small so they stay crisp. -->
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="frost"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#5a7fa3" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a7fa3" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <path id="cloudShape" d="M138 372
      C 96 372 76 342 80 314
      C 84 282 112 262 144 266
      C 150 214 194 182 246 186
      C 268 146 330 136 366 172
      C 392 198 396 228 388 250
      C 428 256 446 290 440 320
      C 434 352 408 372 376 372 Z"/>
    <clipPath id="cloudClip"><use href="#cloudShape"/></clipPath>
    <g id="scene">
      <rect width="512" height="512" fill="url(#sky)"/>
      <rect width="512" height="512" fill="url(#sunGlow)"/>
      <circle cx="380" cy="128" r="30" fill="#fff6dc"/>
      <g filter="url(#edge)">
        <path d="M-20 530 L-20 392 C 110 368 250 318 540 236 L540 530 Z" fill="#a8c296"/>
        <path d="M-20 530 L-20 446 C 150 430 330 386 540 322 L540 530 Z" fill="#6f9264"/>
      </g>
      <path d="M-20 392 C 110 368 250 318 540 236" fill="none" stroke="#8aa97a" stroke-width="3" opacity="0.8"/>
      <path d="M-20 446 C 150 430 330 386 540 322" fill="none" stroke="#56794c" stroke-width="3" opacity="0.8"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <use href="#scene"/>
    <!-- Shadow cast on the scene below the cloud. -->
    <ellipse cx="262" cy="398" rx="170" ry="20" fill="#2c4258" opacity="0.28" filter="url(#shadow)"/>
    <!-- Frosted glass: the scene, blurred, seen through the cloud. -->
    <g clip-path="url(#cloudClip)">
      <g filter="url(#frost)"><use href="#scene"/></g>
      <rect width="512" height="512" fill="url(#glass)"/>
      <rect width="512" height="512" fill="url(#depth)"/>
    </g>
    <!-- A clean rim of light around the glass. -->
    <use href="#cloudShape" fill="none" stroke="url(#rim)" stroke-width="4.5"/>
    <!-- Sharp highlights where the light catches the top. -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M118 290 C 128 278 142 272 156 272" stroke-width="9"/>
      <path d="M214 214 C 228 198 248 192 266 194" stroke-width="10"/>
      <path d="M300 168 C 318 160 338 162 352 172" stroke-width="7" opacity="0.85"/>
    </g>
    <circle cx="186" cy="222" r="6" fill="#ffffff"/>
    <!-- A faint light edge on the tile itself. -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
